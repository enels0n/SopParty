# SopParty Paper configuration

bstats:
  enabled: true

# First sync runs as soon as the player lands on this backend. If > 0, schedules an extra sync after N ticks for late Velocity/Paper binds.
party-sync-delay-ticks: 0

# How long Bukkit waits for a valid proxy response before enabling standalone mode automatically.
proxy-detection-timeout-ticks: 40

standalone:
  max-party-size: 8
  invite-ttl-seconds: 120

tab-complete:
  min-prefix-length: 2
  max-results: 20

permissions:
  reload: 'sopparty.admin.reload'

