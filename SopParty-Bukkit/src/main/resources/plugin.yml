name: SopParty
main: net.enelson.sopparty.bukkit.SopPartyPlugin
version: ${project.version}
api-version: '1.16'
description: Party system for Paper & Spigot 1.16.5+. Authoritative state on Velocity.
softdepend:
  - PlaceholderAPI

commands:
  party:
    description: Party commands
    usage: /<command> [args]
  sopparty:
    description: SopParty administration commands
    usage: /<command> reload

permissions:
  sopparty.admin.reload:
    description: Allows reloading SopParty Velocity settings through the Bukkit bridge.
    default: op
