# SopParty Velocity — defaults copied to plugins/sopparty/sopparty.properties on first run

# Maximum party size (including leader)
max-party-size=8

# Pending invite lifetime (seconds)
invite-ttl-seconds=120

# How often expired invites are discarded (seconds)
invite-prune-interval-seconds=30

#
# Player messages ( &-color legacy ). Omit a key to keep the compiled-in default.
# Placeholders use {0}, {1}. Example:
# msg.create.err.already-in-party=&cYou are already grouped.
#
# Prefix for msg.* keys mirrors VelocityPartyMessages (see jar source or docs).
# Common keys:
# msg.create.err.already-in-party, msg.create.ok.created
# msg.invite.err.*, msg.invite.ok.sent, msg.invite.ok.notify-target
# msg.accept.*, msg.deny.*, msg.leave.*, msg.kick.*, msg.disband.*, msg.transfer.*, msg.list.*
#
# Reservations (queues / arenas):
# msg.reserve.err.not-in-party, msg.reserve.err.leader-only
